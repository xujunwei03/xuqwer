<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>宴席农历日历</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
:root{
  --bg:#ffffff;
  --text:#222;
  --card:#f7f7f7;
  --border:#ddd;
  --today-bg:#e8f4ff;
  --active-bg:#cce5ff;
  --has-ev:#fff2cc;
  --star-wang:#ffdddd;  /*星旺日 红色系*/
  --star-ji:#ffe8cc;    /*星吉日 橙色系*/
  --star-hao:#e9ddff;   /*星好日 紫色系*/
  --star-yi:#ddffdd;    /*星宜日 绿色系*/
  --table-th-bg:#f0f0f0;
  --cell-book-bg:#e0edff;
  --cell-empty-bg:#f8f8f8;
}
html[data-theme="dark"]{
  --bg:#1a1a1a;
  --text:#eee;
  --card:#2a2a2a;
  --border:#444;
  --today-bg:#203040;
  --active-bg:#254060;
  --has-ev:#443820;
  --star-wang:#4b2222;  /*星旺日 深色模式红色*/
  --star-ji:#4b3822;    /*星吉日 深色模式橙色*/
  --star-hao:#382b4b;   /*星好日 深色模式紫色*/
  --star-yi:#224022;    /*星宜日 深色模式绿色*/
  --table-th-bg:#333333;
  --cell-book-bg:#233b58;
  --cell-empty-bg:#272727;
}
body{background:var(--bg);color:var(--text);padding:8px;max-width:1400px;margin:0 auto;}
/* ==========标签页样式========== */
.tab-wrap{
  display:flex;
  gap:4px;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
}
.tab-item{
  padding:8px 16px;
  cursor:pointer;
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:6px 6px 0 0;
  background:var(--card);
}
.tab-item.active{
  background:#2b7cd3;
  color:#fff;
  border-color:#2b7cd3;
}
.tab-panel{
  display:none;
}
.tab-panel.show{
  display:block;
}
/* 头部年月行 */
.header-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:8px;
}
#ym{font-size:22px;font-weight:bold;text-align:center;}
.icon-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:6px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  user-select:none;
}
/* ==========【重点修改：控制栏整行布局，一行放门店｜宴会厅｜操作按钮】 ========== */
.top-filter-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:10px;
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:6px;
}
.shop-filter-area{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.hall-filter-area{
  display:flex;
}
.btn-ctrl-area{
  display:flex;
  gap:6px;
}
button{padding:5px 10px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:4px;cursor:pointer;font-size:14px;}
button.active{background:#2b7cd3;color:#fff;border-color:#2b7cd3;}
/* ========== 新增宴会厅多选下拉样式 ========== */
.hall-filter-wrap{
  position:relative;
  display:inline-block;
}
#hallSelectBtn{
  padding:5px 10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
  min-width:140px;
}
.hall-dropdown{
  position:absolute;
  top:100%;
  left:0;
  z-index:99;
  border:1px solid var(--border);
  background:var(--bg);
  max-height:260px;
  overflow-y:auto;
  min-width:220px;
  border-radius:4px;
  display:none;
}
.hall-dropdown.show{
  display:block;
}
.hall-item{
  padding:4px 8px;
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
}
.hall-item:hover{
  background:var(--card);
}
.hall-empty-text{
  font-size:10px;
  color:#ff2222;  /* 修改：宴会厅空行文字红色 */
  line-height:1.1;
}
/* ==========【状态信息：改为普通文档流，页面右下角，不再fixed悬浮】 ========== */
.status-wrap-wrap{
  display:flex;
  justify-content:flex-end;
  margin-top:12px;
}
.status-wrap{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 8px;
  max-width:340px;
  font-size:12px;
}
.status-line{
  margin:2px 0;
  line-height:1.3;
}
/* ==========【标签页一：日场地 原有日历】 ========== */
#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
/*星期头部*/
.week-header{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  margin-bottom:4px;
}
.week-header>div{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  background:var(--card);
  border-radius:4px;
  border:1px solid var(--border);
}
.day-item{position:relative;border:1px solid var(--border);min-height:82px;padding:3px;border-radius:4px;background:var(--card);overflow:hidden;}
.day-item.empty{background:transparent;border:none;}
.day-item.today{background:var(--today-bg);}
.day-item.active{background:var(--active-bg);}
.day-item.has-ev{background:var(--has-ev);}
.day-item.star-wang{background:var(--star-wang);}
.day-item.star-ji{background:var(--star-ji);}
.day-item.star-hao{background:var(--star-hao);}
.day-item.star-yi{background:var(--star-yi);}
.solar{font-size:16px;font-weight:bold;position:relative;line-height:1.1;}
/* 今日星星放在左下角 */
.today-mark{
  position:absolute;
  left:2px;
  bottom:2px;
  color:#ff3333;
  font-size:14px;
}
.lunar{font-size:10px;opacity:0.85;line-height:1.1;}
.festival,.lunar-festival,.solar-term{font-size:11px;color:#d03030;line-height:1.1;}
.star-tag{font-size:11px;color:#0066aa;font-weight:bold;line-height:1.1;}
.ev-badge{position:absolute;top:1px;right:1px;background:#d92121;color:#fff;border-radius:99px;font-size:10px;padding:0 3px;min-width:14px;text-align:center;line-height:1.2;}
#infoCard{margin-top:12px;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);display:none;}
.detail-item{border-top:1px solid var(--border);padding:6px 0;font-size:13px;line-height:1.5;}
/* ==========【标签页二：月场地 表格视图 冻结首行首列】 ========== */
.month-table-wrap{
  overflow:auto;
  max-height:72vh;
  border:1px solid var(--border);
}
.month-table{
  border-collapse: collapse;
  min-width:1100px;
  table-layout:fixed;
}
.month-table th,
.month-table td{
  border:1px solid var(--border);
  padding:4px;
  font-size:12px;
  text-align:center;
}
/*冻结顶部表头*/
.month-table thead th{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--table-th-bg);
}
/* =========新增：月场地表头 星日期背景色，和日场地完全复用变量 ========= */
.month-table thead th.star-wang { background: var(--star-wang); }
.month-table thead th.star-ji  { background: var(--star-ji); }
.month-table thead th.star-hao{ background: var(--star-hao); }
.month-table thead th.star-yi { background: var(--star-yi); }
/*冻结第一列宴会厅*/
.month-table th:first-child,
.month-table td:first-child{
  position:sticky;
  left:0;
  z-index:5;
  background:var(--card);
  min-width:110px;
}
/*表头左上角双重冻结*/
.month-table thead th:first-child{
  z-index:15;
}
.month-cell-book{
  background:var(--cell-book-bg);
  padding:2px;
  border-radius:3px;
  font-size:10px; /*字体缩小*/
  line-height:1.3;
}
.month-cell-empty{
  background:var(--cell-empty-bg);
  padding:2px;
  border-radius:3px;
  font-size:10px;
  line-height:1.3;
  color:#888;
  cursor:pointer;
}
/*预定情况文字颜色规则*/
.text-wu{
  color:#ff7800; /*午：橙色*/
}
.text-wan{
  color:#9227b0; /*晚：紫色*/
}
/* 宴会厅单元格容器（用于放右上角角标） */
.hall-td-wrap{
  position:relative;
  width:100%;
  height:100%;
}
/*月场地宴会厅计数小红角标*/
.hall-count-badge{
  position:absolute;
  top:-4px;
  right:-4px;
  background:#d92121;
  color:#fff;
  font-size:10px;
  border-radius:99px;
  min-width:14px;
  height:14px;
  line-height:14px;
  text-align:center;
  cursor:pointer;
  z-index:2;
}
/*手机小屏幕进一步压缩*/
@media (max-width:768px){
  /* 移除flex-direction:column，手机也保持横向，空间不够自动换行 */
  .top-filter-bar{
    flex-wrap: wrap;
    align-items: center;
  }
  /* 按钮缩小，适配手机 */
  .top-filter-bar button{
    font-size:12px;
    padding:4px 6px;
  }
  #hallSelectBtn{
    font-size:12px;
    padding:4px 6px;
    min-width:110px;
  }
}
@media (max-width:480px){
  body{padding:4px;}
  #ym{font-size:18px;margin-bottom:0;}
  .icon-btn{width:30px;height:30px;font-size:16px;}
  .day-item{min-height:66px;padding:2px;}
  .solar{font-size:14px;}
  .lunar{font-size:9px;}
  .festival,.lunar-festival,.solar-term,.star-tag{font-size:9px;}
  .ev-badge{font-size:9px;min-width:12px;}
  .status-line{font-size:11px;}
  .hall-dropdown{min-width:180px;}
  .hall-empty-text{font-size:9px;}
  .tab-item{padding:6px 10px;font-size:14px;}
  .status-wrap{
    max-width:240px;
  }
  /*超小屏继续缩小按钮*/
  .top-filter-bar button{
    font-size:11px;
    padding:3px 4px;
  }
  #hallSelectBtn{
    min-width:90px;
    font-size:11px;
  }
}
</style>
</head>
<body>
<!-- ==========标签页新增========== -->
<div class="tab-wrap">
  <div class="tab-item active" data-tab="day">日场地</div>
  <div class="tab-item" data-tab="month">月场地</div>
</div>
<div class="header-wrap">
  <div class="icon-btn" id="prev">◀</div>
  <div id="ym"></div>
  <div class="icon-btn" id="next">▶</div>
</div>
<!-- ==========【修改：把门店、宴会厅、刷新、切换深色全部放到这一行容器】 ========== -->
<div class="top-filter-bar">
  <div class="shop-filter-area" id="shopFilterBar"></div>
  <div class="hall-filter-area">
    <div class="hall-filter-wrap">
      <button id="hallSelectBtn">选择宴会厅 ▾</button>
      <div class="hall-dropdown" id="hallDropdown"></div>
    </div>
  </div>
  <div class="btn-ctrl-area">
    <button id="refresh">刷新数据</button>
    <button id="themeBtn">切换深色</button>
  </div>
</div>
<!-- ==========标签页1：日场地【原有农历日历】 ========== -->
<div class="tab-panel show" id="panel-day">
  <!--星期头部栏-->
  <div class="week-header">
    <div>日</div>
    <div>一</div>
    <div>二</div>
    <div>三</div>
    <div>四</div>
    <div>五</div>
    <div>六</div>
  </div>
  <div id="calendar"></div>
  <div id="infoCard">
    <div id="infoText"></div>
  </div>
</div>
<!-- ==========标签页2：月场地【仿app月场地表格视图】 ========== -->
<div class="tab-panel" id="panel-month">
  <div class="month-table-wrap">
    <table class="month-table" id="monthTableEl">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<!-- =========状态信息块：移到页面文档流末尾，右对齐，不再fixed悬浮 ========= -->
<div class="status-wrap-wrap">
  <div class="status-wrap">
    <div class="status-line" id="lunarLoadStatus"></div>
    <div class="status-line" id="starStatus"></div>
    <div class="status-line" id="loadStatus"></div>
    <div class="status-line" id="cacheInfo"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

const lunarDayCn = [
    "","初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",

/**
 * 格式化农历显示：
 * - 如果star.xlsx农历列已经是"七月初二"这种文本，直接返回

 */
function formatLunarDisplay(rawVal){
  if(rawVal === null || rawVal === undefined || rawVal === "") return "";
  // 已经是字符串，直接展示
  if(typeof rawVal === "string") return rawVal.trim();
  // 对象格式 {lunarMonthStr,lunarDayStr,isLeap} 兼容
  if(typeof rawVal === "object"){
    const leapTxt = rawVal.isLeap ? "闰" : "";
    return `${leapTxt}${rawVal.lunarMonthStr || ""}${rawVal.lunarDayStr || ""}`;
  }
  return String(rawVal);
}

// ========== 本地缓存工具 ==========
function saveEventCache(list){
  try{
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
      updateTime: Date.now(),
      data: list
    }));
  }catch(e){
    console.warn("浏览器阻止localStorage写入",e);
  }
}
function readEventCache(){
  try{
    const str = localStorage.getItem(LOCAL_STORAGE_KEY);
    if(!str) return null;
    return JSON.parse(str);
  }catch(e){
    console.warn("浏览器阻止localStorage读取",e);
    return null;

function getMonthEventFromCache(y,m){
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const end = `${y}-${String(m).padStart(2,"0")}-${new Date(y,m,0).getDate()}`;
  return fullEventList.filter(item => item.date >= start && item.date <= end);
}
/**
 * 获取某个宴会厅【本月已预定日期数组】、【本月空闲未预定日期数组】
 */
function getHallBookAndFreeDays(y,m,hallName,monthEvList){
  const totalDay = new Date(y,m,0).getDate();
  // 该厅所有事件
  const hallEv = monthEvList.filter(e=>e.hall === hallName);
  const bookDateSet = new Set();
  hallEv.forEach(e=>bookDateSet.add(e.date));
  const bookDays = Array.from(bookDateSet).sort();
  // 全部当月日期
  const allDateArr = [];
  for(let d=1;d<=totalDay;d++){
    const ds = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    allDateArr.push(ds);
  }
  // 求差集 = 空闲日期
  const freeDays = allDateArr.filter(ds=>!bookDateSet.has(ds));
  return {bookDays,freeDays};
}
/**
 * 弹窗：展示宴会厅预定日期 + 空闲日期
 */
function showHallDayAlert(hallName,y,m){
  const monthEv = getMonthEventFromCache(y,m);
  const {bookDays,freeDays} = getHallBookAndFreeDays(y,m,hallName,monthEv);
  const weekArr = ["周日","周一","周二","周三","周四","周五","周六"];
  // 给日期数组每一项拼接星期
  const bookDaysWithWeek = bookDays.map(ds=>{
    const d = new Date(ds);
    return `${ds} (${weekArr[d.getDay()]})`;
  });
  const freeDaysWithWeek = freeDays.map(ds=>{
    const d = new Date(ds);
    return `${ds} (${weekArr[d.getDay()]})`;
  });
  let msg = `【${hallName}】${y}年${m}月\n`;
  msg += `✅本月预定共${bookDays.length}场\n预定日期：\n${bookDaysWithWeek.join("\n")||"无"}\n\n`;
  msg += `⭕本月空闲（未预定）共${freeDays.length}天\n空闲日期：\n${freeDaysWithWeek.join("\n")||"全部已排满"}`;
  alert(msg);
}

// ========== 星日期Excel（同时读取农历列）==========
async function loadStarExcel() {
  const statusEl = document.getElementById("starStatus");
  const lunarStatusEl = document.getElementById("lunarLoadStatus");
  try {
    const resp = await fetch(STAR_EXCEL_CONFIG.url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheetName = STAR_EXCEL_CONFIG.sheetName || wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    if (!sheet) throw new Error("找不到工作表：" + sheetName);
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
    const starMap = {};
    const lunarMap = {};
    const startIdx = STAR_EXCEL_CONFIG.skipHeader ? 1 : 0;
    for (let i = startIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.length === 0) continue;
      let dateVal = row[STAR_EXCEL_CONFIG.dateColumn];
      const starVal = (row[STAR_EXCEL_CONFIG.starColumn] || "").toString().trim();
      const lunarVal = row[STAR_EXCEL_CONFIG.lunarColumn];
      if (!dateVal) continue;
      let dateStr;
      if (dateVal instanceof Date) {
        dateStr = dateVal.getFullYear() + "-" + String(dateVal.getMonth() + 1).padStart(2, "0") + "-" + String(dateVal.getDate()).padStart(2, "0");
      } else {
        dateVal = dateVal.toString().trim();
        const parts = dateVal.split(/[\/\-]/);
        if (parts.length === 3) {
          dateStr = parts[0] + "-" + String(parts[1]).padStart(2, "0") + "-" + String(parts[2]).padStart(2, "0");
        } else {
          continue;
        }
      }
      if (starVal) starMap[dateStr] = starVal;
      if (lunarVal !== undefined && lunarVal !== null && lunarVal !== "") {
        lunarMap[dateStr] = lunarVal;
      }
    }
    starDateMap = starMap;
    starLunarMap = lunarMap;
    if(statusEl){
      statusEl.innerText = `星日期已加载（${Object.keys(starMap).length}条）`;
      statusEl.style.color = "#0e9f6e";
    }
    if(lunarStatusEl){
      lunarStatusEl.innerText = `✅农历数据已从star.xlsx载入，共${Object.keys(lunarMap).length}条`;
      lunarStatusEl.style.color = "#0e9f6e";
    }
    return true;
  } catch (e) {
    console.error("星日期Excel加载失败：", e);
    if(statusEl){
      statusEl.innerText = "星日期加载失败（不影响其他功能）";
      statusEl.style.color = "#d92121";
    }
    if(lunarStatusEl){
      lunarStatusEl.innerText = "⚠️star.xlsx读取失败，无农历/星日期";
      lunarStatusEl.style.color = "#d92121";
    }
    // 就算读取失败，也不要置空，保留空对象，日历依然可以渲染公历
    return false;
  }
}
// ========== 宴席数据 ==========
async function loadFeishuJson(forceRefresh = false){
  if(loading) return;
  loading = true;
  const loadStatus = document.getElementById("loadStatus");
  const cacheInfo = document.getElementById("cacheInfo");
  try{
    if(forceRefresh){
      if(loadStatus) loadStatus.innerText = "正在读取feishu_data.json宴席数据...";
    }
    const resp = await fetch(FESHU_JSON_URL, { cache: forceRefresh ? "no-cache" : "default" });
    if(!resp.ok) throw new Error(`文件读取失败 ${resp.status}，确认feishu_data.json和index.html放在同一目录`);
    const rawArr = await resp.json();
    const formatList = rawArr.map(item => {
      return {
        date: item["宴会日期"] || "",
        hall: item["宴会厅"] || "",
        shop: item["门店"] || "",
        customer: item["客户|宴会主题"] || "",
        table: item["桌数"] || "",
        sales: item["销售负责人"] || "",
        title: item["预定情况"] || "",
        banquetType: item["宴会类型"] || "",    //新增宴会类型
        banquetTime: item["宴会时段"] || ""     //新增宴会时段
      }
    }).filter(item => !!item.date);
    fullOriginEventList = formatList;
    applyShopFilter();
    saveEventCache(fullOriginEventList);
    const time = new Date().toLocaleString();
    if(cacheInfo){
      cacheInfo.innerText = `缓存更新:${time}`;
      cacheInfo.style.color = "#0e9f6e";
    }
    renderShopFilterButtons();
    renderHallDropdown();
    renderCalendar();
    renderMonthTable(); //加载完数据渲染月场地表格
    if(loadStatus) loadStatus.innerText = `✅已同步全部宴席${fullOriginEventList.length}条`;
  }catch(err){
    if(!forceRefresh){
      if(loadStatus) loadStatus.innerText = "网络更新失败，继续使用本地缓存";
    }else{
      alert("读取feishu_data.json失败：" + err.message);
      if(loadStatus) loadStatus.innerText = "❌读取json失败";
    }
    console.error(err);
  }finally{
    loading = false;
  }
}

  const groupMap = {};
  for(const ev of eventData){
    if(!ev.date) continue;

    groupMap[ev.date].push(ev);
  }
  for(let i = 0; i < weekStart; i++){

    if(starType === "星吉日") div.classList.add("star-ji");

          //依然根据宴会时段判断午/晚颜色
          if((item.banquetTime||"").includes("午")) clsArr.push("text-wu");
          if((item.banquetTime||"").includes("晚")) clsArr.push("text-wan");
          const clsStr = clsArr.length>0 ? `class="${clsArr.join(" ")}"` : "";
          innerHtml += `<div class="month-cell-book"><span ${clsStr}>${showText}</span></div>`;
        })
        td.innerHTML = innerHtml;
      }else{
        // 无预定：显示【空】，点击弹窗查看空闲日期
        td.innerHTML = `<div class="month-cell-empty"></div>`;
        td.onclick = function(){
          showHallDayAlert(hallName,currentYear,currentMonth);
        }
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}
// 切换月份逻辑
function goPrevMonth(){
  if(loading) return;
  currentMonth--;
  if(currentMonth < 1){ currentMonth = 12; currentYear--; }
  selectItem = null;
  infoCard.style.display = "none";
  renderCalendar();
  renderMonthTable(); //月份切换同步刷新月场地表格
}
function goNextMonth(){
  if(loading) return;
  currentMonth++;
  if(currentMonth > 12){ currentMonth = 1; currentYear++; }
  selectItem = null;
  infoCard.style.display = "none";
  renderCalendar();
  renderMonthTable(); //月份切换同步刷新月场地表格
}
//标签页切换绑定
function bindTabEvent(){
  const tabItems = document.querySelectorAll(".tab-item");
  tabItems.forEach(tab=>{
    tab.onclick = function(){
      const tabKey = this.dataset.tab;
      tabItems.forEach(t=>t.classList.remove("active"));
      this.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("show"));
      document.getElementById(`panel-${tabKey}`).classList.add("show");
    }
  })
}
function bindEvent(){
  $("#prev").onclick = goPrevMonth;
  $("#next").onclick = goNextMonth;
  $("#refresh").onclick = async () => {
    await loadFeishuJson(true);
  };
  const themeBtn = $("#themeBtn");
  themeBtn.onclick = () => {
    const html = document.documentElement;
    html.hasAttribute("data-theme") ? (html.removeAttribute("data-theme"), themeBtn.innerText = "切换深色") : (html.setAttribute("data-theme", "dark"), themeBtn.innerText = "切换浅色");
  };
  // 宴会厅下拉点击展开收起
  const hallBtn = $("#hallSelectBtn");
  const hallDropdown = $("#hallDropdown");
  hallBtn.onclick = (e)=>{
    e.stopPropagation();
    hallDropdown.classList.toggle("show");
  };
  // 点击页面任意位置关闭下拉
  document.addEventListener("click",()=>{
    hallDropdown.classList.remove("show");
  })
}
//页面加载完成执行初始化
window.addEventListener('DOMContentLoaded',init);
</script>
